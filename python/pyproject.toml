[project]
name = "teleia"
version = "0.1.0"
description = "Minimal TUI coding agent (Python)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "foolish-dev" }]
dependencies = []

[project.scripts]
teleia = "teleia.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["teleia*"]
