<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" role="img" aria-label="Teleia TUI screenshot mockup">
  <title>Teleia TUI</title>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- page bg -->
  <rect width="1100" height="700" fill="#0f1018"/>

  <!-- terminal frame -->
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="1020" height="620" rx="14" fill="#1a1b26"/>
    <!-- title bar -->
    <rect x="40" y="40" width="1020" height="34" rx="14" fill="#16161e"/>
    <rect x="40" y="56" width="1020" height="18" fill="#16161e"/>
    <circle cx="64"  cy="57" r="6" fill="#f7768e"/>
    <circle cx="84"  cy="57" r="6" fill="#e0af68"/>
    <circle cx="104" cy="57" r="6" fill="#9ece6a"/>
    <text x="550" y="62" text-anchor="middle"
          font-family="Iosevka, 'JetBrains Mono', monospace"
          font-size="12" fill="#565f89">teleia · session 01K3R7H · ready</text>
  </g>

  <!-- transcript -->
  <g font-family="Iosevka, 'JetBrains Mono', 'IBM Plex Mono', monospace" font-size="14">
    <!-- user 1 -->
    <text x="68" y="110" fill="#7dcfff" font-weight="700">you</text>
    <text x="68" y="132" fill="#c0caf5">audit crates/teleia-agent for dead code</text>

    <!-- assistant 1 -->
    <text x="68" y="172" fill="#bb9af7" font-weight="700">teleia</text>
    <text x="68" y="194" fill="#c0caf5">reading the agent module now</text>

    <!-- tool call 1 -->
    <text x="68" y="226" fill="#e0af68">⚙ read({"path":"crates/teleia-agent/src/lib.rs"})</text>
    <text x="90" y="246" fill="#565f89">use teleia_llm::{LlmClient, Message, Role};</text>
    <text x="90" y="262" fill="#565f89">use teleia_tools::{definitions, dispatch};</text>
    <text x="90" y="278" fill="#565f89">…204 lines…</text>

    <!-- assistant 2 -->
    <text x="68" y="316" fill="#bb9af7" font-weight="700">teleia ▌</text>
    <text x="68" y="338" fill="#c0caf5">one issue: tool_queue (lines 88-99) is never</text>
    <text x="68" y="356" fill="#c0caf5">pushed to. dispatch happens inline at line 132,</text>
    <text x="68" y="374" fill="#c0caf5">so the queue and its drain loop are dead.</text>

    <!-- tool call 2 -->
    <text x="68" y="406" fill="#e0af68">⚙ edit({"path":"crates/teleia-agent/src/lib.rs",…})</text>
    <text x="90" y="426" fill="#565f89">edited crates/teleia-agent/src/lib.rs</text>

    <!-- info line -->
    <text x="68" y="464" fill="#7aa2f7">· saved current session as 'audit-pass-1'</text>
  </g>

  <!-- input box -->
  <g>
    <rect x="56" y="540" width="988" height="40" rx="8" fill="none" stroke="#414868" stroke-width="1.2"/>
    <text x="72" y="565" font-family="Iosevka, monospace" font-size="14" fill="#7dcfff">&gt;</text>
    <text x="92" y="565" font-family="Iosevka, monospace" font-size="14" fill="#c0caf5">/save audit-pass-1</text>
    <rect x="232" y="552" width="2" height="16" fill="#c0caf5">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.06s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- status -->
  <text x="56" y="608" font-family="Iosevka, monospace" font-size="12" fill="#565f89" font-style="italic">
    session 01K3R7H · ready   enter send · ↑↓ scroll · /help cmds · ctrl-c quit
  </text>
</svg>
