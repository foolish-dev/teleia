<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Teleia polyglot architecture">
  <title>Teleia polyglot architecture</title>
  <defs>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#bb9af7" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0.0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#565f89"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#1a1b26"/>

  <!-- title -->
  <text x="600" y="48" text-anchor="middle"
        font-family="Iosevka, 'JetBrains Mono', monospace"
        font-size="22" fill="#c0caf5" font-weight="700">five impls · one session store</text>
  <text x="600" y="74" text-anchor="middle"
        font-family="Iosevka, 'JetBrains Mono', monospace"
        font-size="13" fill="#7dcfff" opacity="0.85">$XDG_DATA_HOME/teleia/teleia.sqlite</text>

  <!-- impl boxes (5 across) -->
  <g font-family="Iosevka, 'JetBrains Mono', monospace">
    <!-- rust -->
    <g transform="translate(60 120)">
      <rect width="180" height="120" rx="10" fill="#24283b" stroke="#7aa2f7" stroke-width="1.5"/>
      <text x="90" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#7aa2f7">rust/</text>
      <text x="90" y="62" text-anchor="middle" font-size="11" fill="#c0caf5">ratatui</text>
      <text x="90" y="80" text-anchor="middle" font-size="11" fill="#c0caf5">reqwest</text>
      <text x="90" y="98" text-anchor="middle" font-size="11" fill="#c0caf5">rusqlite</text>
    </g>
    <!-- python -->
    <g transform="translate(280 120)">
      <rect width="180" height="120" rx="10" fill="#24283b" stroke="#e0af68" stroke-width="1.5"/>
      <text x="90" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#e0af68">python/</text>
      <text x="90" y="62" text-anchor="middle" font-size="11" fill="#c0caf5">curses</text>
      <text x="90" y="80" text-anchor="middle" font-size="11" fill="#c0caf5">urllib</text>
      <text x="90" y="98" text-anchor="middle" font-size="11" fill="#c0caf5">sqlite3</text>
    </g>
    <!-- go -->
    <g transform="translate(500 120)">
      <rect width="180" height="120" rx="10" fill="#24283b" stroke="#7dcfff" stroke-width="1.5"/>
      <text x="90" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#7dcfff">go/</text>
      <text x="90" y="62" text-anchor="middle" font-size="11" fill="#c0caf5">bubbletea</text>
      <text x="90" y="80" text-anchor="middle" font-size="11" fill="#c0caf5">net/http</text>
      <text x="90" y="98" text-anchor="middle" font-size="11" fill="#c0caf5">modernc/sqlite</text>
    </g>
    <!-- lua -->
    <g transform="translate(720 120)">
      <rect width="180" height="120" rx="10" fill="#24283b" stroke="#9ece6a" stroke-width="1.5"/>
      <text x="90" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#9ece6a">lua/</text>
      <text x="90" y="62" text-anchor="middle" font-size="11" fill="#c0caf5">ANSI + io.read</text>
      <text x="90" y="80" text-anchor="middle" font-size="11" fill="#c0caf5">curl (shell-out)</text>
      <text x="90" y="98" text-anchor="middle" font-size="11" fill="#c0caf5">sqlite3 (shell-out)</text>
    </g>
    <!-- bun -->
    <g transform="translate(940 120)">
      <rect width="180" height="120" rx="10" fill="#24283b" stroke="#bb9af7" stroke-width="1.5"/>
      <text x="90" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#bb9af7">bun/</text>
      <text x="90" y="62" text-anchor="middle" font-size="11" fill="#c0caf5">ink (React)</text>
      <text x="90" y="80" text-anchor="middle" font-size="11" fill="#c0caf5">fetch</text>
      <text x="90" y="98" text-anchor="middle" font-size="11" fill="#c0caf5">bun:sqlite</text>
    </g>
  </g>

  <!-- arrows from each box down to the sqlite spine -->
  <g stroke="#565f89" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M150 244 V 380"/>
    <path d="M370 244 V 380"/>
    <path d="M590 244 V 380"/>
    <path d="M810 244 V 380"/>
    <path d="M1030 244 V 380"/>
  </g>

  <!-- shared sqlite -->
  <g transform="translate(60 400)">
    <rect width="1080" height="90" rx="14" fill="#24283b" stroke="url(#spine)" stroke-width="2"/>
    <text x="540" y="42" text-anchor="middle"
          font-family="Iosevka, 'JetBrains Mono', monospace"
          font-size="20" font-weight="700" fill="#bb9af7">sqlite · sessions · messages · aliases</text>
    <text x="540" y="68" text-anchor="middle"
          font-family="Iosevka, 'JetBrains Mono', monospace"
          font-size="12" fill="#7dcfff" opacity="0.9">OpenAI-standard message JSON · /save and /load by alias from any impl</text>
  </g>

  <!-- footer -->
  <text x="600" y="540" text-anchor="middle"
        font-family="Iosevka, 'JetBrains Mono', monospace"
        font-size="13" fill="#565f89">every impl streams from the same Ollama endpoint · http://127.0.0.1:11434/v1</text>
  <text x="600" y="565" text-anchor="middle"
        font-family="Iosevka, 'JetBrains Mono', monospace"
        font-size="12" fill="#565f89" font-style="italic">τελεία · full stop</text>
</svg>
