<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="τέλεια — a minimal TUI coding agent">
  <title>τέλεια</title>
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.55" stop-color="#9d8cf7"/>
      <stop offset="1" stop-color="#bb9af7"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
                        from="0 0.5 0.5" to="360 0.5 0.5"
                        dur="22s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dcfff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="word">
      <text x="324" y="160" font-size="108" font-weight="700" letter-spacing="-2"
            font-family="Iosevka, 'JetBrains Mono', 'IBM Plex Mono', Menlo, monospace">τέλεια</text>
    </clipPath>
    <radialGradient id="bgGlow" cx="0.25" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#414868" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1a1b26" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="#1a1b26"/>
  <rect width="1200" height="300" fill="url(#bgGlow)"/>

  <!-- dotted prompt rule under the wordmark line -->
  <line x1="324" y1="172" x2="1100" y2="172" stroke="#414868" stroke-width="1" stroke-dasharray="2 6" opacity="0.5"/>

  <!-- Τ mark with greek period -->
  <g transform="translate(96 70)">
    <g fill="url(#t)">
      <rect x="0" y="0" width="160" height="24" rx="5"/>
      <rect x="68" y="0" width="24" height="140" rx="5"/>
    </g>
    <circle cx="148" cy="148" r="12" fill="#f7768e">
      <animate attributeName="opacity"
               values="1;1;0.2;0.2;1"
               keyTimes="0;0.5;0.5;1;1"
               dur="1.06s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark + blink cursor + shimmer sweep -->
  <g font-family="Iosevka, 'JetBrains Mono', 'IBM Plex Mono', Menlo, monospace">
    <text x="324" y="160" font-size="108" font-weight="700" letter-spacing="-2" fill="#c0caf5">τέλεια</text>
    <rect x="720" y="78" width="22" height="86" fill="#7dcfff" opacity="0.85">
      <animate attributeName="opacity"
               values="0.85;0.85;0;0;0.85"
               keyTimes="0;0.5;0.5;1;1"
               dur="1.06s" repeatCount="indefinite"/>
    </rect>
    <g clip-path="url(#word)">
      <rect x="-300" y="60" width="200" height="140" fill="url(#sweep)">
        <animate attributeName="x" from="-300" to="700" dur="5.5s"
                 begin="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- tagline + mode chip row -->
    <text x="328" y="208" font-size="26" fill="#7dcfff" opacity="0.92">a minimal TUI coding agent</text>

    <!-- BUILD chip + provider list mini-row -->
    <g transform="translate(328 232)">
      <rect x="0" y="0" width="60" height="20" rx="3" fill="#9ece6a"/>
      <text x="30" y="14" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1b26">BUILD</text>
      <text x="74" y="14" font-size="13" fill="#565f89">15 providers · 130 models · 7 tools · MCP</text>
    </g>

    <text x="328" y="276" font-size="16" fill="#565f89" font-style="italic">telia · full stop</text>
  </g>
</svg>
