<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Teleia — the distilled coding agent">
  <title>Teleia</title>
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="#1a1b26"/>

  <!-- mark: T with greek period -->
  <g transform="translate(96 70)">
    <g fill="url(#t)">
      <rect x="0" y="0" width="160" height="24" rx="4"/>
      <rect x="68" y="0" width="24" height="140" rx="4"/>
    </g>
    <circle cx="148" cy="148" r="12" fill="#f7768e"/>
  </g>

  <!-- wordmark -->
  <g font-family="Iosevka, 'JetBrains Mono', 'IBM Plex Mono', Menlo, monospace" fill="#c0caf5">
    <text x="324" y="160" font-size="108" font-weight="700" letter-spacing="-2">Teleia</text>
    <text x="328" y="208" font-size="28" fill="#7dcfff" opacity="0.9">the distilled coding agent</text>
    <text x="328" y="244" font-size="20" fill="#565f89" font-style="italic">τελεία · full stop</text>
  </g>
</svg>
