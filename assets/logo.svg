<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Teleia">
  <title>Teleia</title>
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
                        from="0 0.5 0.5" to="360 0.5 0.5"
                        dur="18s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="40" fill="#1a1b26"/>
  <g fill="url(#t)">
    <rect x="56" y="64" width="144" height="24" rx="4"/>
    <rect x="116" y="64" width="24" height="128" rx="4"/>
  </g>
  <circle cx="180" cy="184" r="14" fill="#f7768e">
    <animate attributeName="opacity"
             values="1;1;0;0;1"
             keyTimes="0;0.5;0.5;1;1"
             dur="1.06s" repeatCount="indefinite"/>
  </circle>
</svg>
