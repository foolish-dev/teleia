<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="τέλεια">
  <title>τέλεια</title>
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
                        from="0 0.5 0.5" to="360 0.5 0.5"
                        dur="18s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="40" fill="#1a1b26"/>
  <!-- inner accent ring -->
  <rect x="14" y="14" width="228" height="228" rx="32" fill="none" stroke="#414868" stroke-width="1" opacity="0.6"/>
  <!-- T mark -->
  <g fill="url(#t)">
    <rect x="52" y="60" width="152" height="28" rx="6"/>
    <rect x="114" y="60" width="28" height="132" rx="6"/>
  </g>
  <!-- greek period dot, slightly larger for icon prominence -->
  <circle cx="184" cy="188" r="16" fill="#f7768e">
    <animate attributeName="opacity"
             values="1;1;0;0;1"
             keyTimes="0;0.5;0.5;1;1"
             dur="1.06s" repeatCount="indefinite"/>
  </circle>
</svg>
