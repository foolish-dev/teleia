<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="τέλεια">
  <title>τέλεια — λ</title>
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="0.5" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
                        from="0 0.5 0.5" to="360 0.5 0.5"
                        dur="22s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#7dcfff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stopGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7768e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f7768e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- card -->
  <rect width="256" height="256" rx="44" fill="#1a1b26"/>
  <rect width="256" height="256" rx="44" fill="url(#glow)"/>

  <!-- thin accent border -->
  <rect x="10" y="10" width="236" height="236" rx="36" fill="none"
        stroke="#414868" stroke-width="1" opacity="0.55"/>

  <!-- Greek lowercase λ rendered as a typographic glyph in the
       gradient. Iosevka / JetBrains Mono / etc. all render this well;
       fallbacks cover everywhere else. -->
  <text x="118" y="188"
        font-family="Iosevka, 'JetBrains Mono', 'IBM Plex Mono', Menlo, monospace"
        font-size="200" font-weight="700"
        text-anchor="middle" fill="url(#t)">λ</text>

  <!-- full stop · terminal-cursor block, soft red halo -->
  <g>
    <circle cx="206" cy="200" r="22" fill="url(#stopGlow)">
      <animate attributeName="opacity"
               values="0.9;0.9;0.1;0.1;0.9"
               keyTimes="0;0.5;0.5;1;1"
               dur="1.06s" repeatCount="indefinite"/>
    </circle>
    <rect x="196" y="190" width="20" height="20" rx="3" fill="#f7768e">
      <animate attributeName="opacity"
               values="1;1;0.2;0.2;1"
               keyTimes="0;0.5;0.5;1;1"
               dur="1.06s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
