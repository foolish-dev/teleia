[workspace]
resolver = "2"
members = [
    "crates/telia-cli",
    "crates/telia-llm",
    "crates/telia-tools",
    "crates/telia-tools-bin",
    "crates/telia-store",
    "crates/telia-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["foolish-dev"]
repository = "https://github.com/foolish-dev/telia"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
libc = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
toml = "0.8"
regex = "1"
glob = "0.3"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
rpassword = "7"

telia-llm = { path = "crates/telia-llm" }
telia-tools = { path = "crates/telia-tools" }
telia-store = { path = "crates/telia-store" }
telia-agent = { path = "crates/telia-agent" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
