[workspace]
resolver = "2"
members = [
    "crates/teleia-cli",
    "crates/teleia-llm",
    "crates/teleia-tools",
    "crates/teleia-tools-bin",
    "crates/teleia-store",
    "crates/teleia-agent",
    "crates/teleia-grogu",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["foolish-dev"]
repository = "https://github.com/foolish-dev/teleia"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "io-util", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
libc = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
toml = "0.8"
regex = "1"
glob = "0.3"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
rpassword = "7"
self-replace = "1"

teleia-llm = { path = "crates/teleia-llm" }
teleia-tools = { path = "crates/teleia-tools" }
teleia-store = { path = "crates/teleia-store" }
teleia-agent = { path = "crates/teleia-agent" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
