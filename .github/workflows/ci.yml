name: ci

on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --all-targets --locked
      - run: cargo test --all-targets --locked

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q teleia
      - name: Help
        run: python -m teleia --help

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.sum
      - run: go build ./...
      - run: go vet ./...

  lua:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lua
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua + luac
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luac
      - name: Syntax-check all modules
        run: |
          for f in teleia.lua teleia/*.lua; do
            luac -p "$f"
          done
      - name: Help
        run: lua5.4 teleia.lua --help

  bun:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bun
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun src/index.ts --help
